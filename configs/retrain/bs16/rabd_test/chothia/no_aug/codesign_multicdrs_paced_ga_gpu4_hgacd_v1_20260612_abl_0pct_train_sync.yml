# Ablation config: abl_0.3_train_sysn
# Ablate the 30% train-sync fallback: region_async_training.prob = 1.00, so probabilistic sync fallback is 0%.
# formal full50000 training config with pair geometry auxiliary loss
# explicit surface core/rim antigen extraction + cdr_only soft_only training
model:
  type: diffab
  res_feat_dim: 128
  pair_feat_dim: 64
  region_feat_dim: 64
  diffusion:
    num_steps: 100
    eps_net_opt:
      denoise_net: ga
      num_layers: 6
      dropout: 0.2
      cfg_dropout: 0.1
      encoder_opt:
        region_relation_opt:
          design_variant: hgacd_region_residue_bidirectional_v1
          cross_attention_use_relation_bias: false
          hierarchical_region_residue:
            enabled: true
            residual_scale: 0.35
            condition_distance_scale: 10.0
            condition_contact_cutoff: 8.0
            use_distance_bias: true
            contact_latent_enabled: true
            contact_supervision_enabled: true
            contact_supervision_cutoff: 8.0
            contact_feedback_scale: 0.25
          aux_losses:
            enabled: true
            contig_logit_rank:
              enabled: true
              margin_logit: 0.1
              start_step: 250
              t_cdr_max: 40
            pair_contact:
              enabled: true
              start_step: 100
              cutoff: 8.0
              cdr_epi_weight: 2.0
            pair_geometry:
              enabled: true
              start_step: 100
              contact_cutoff: 8.0
              distance_clip: 20.0
              topk: 8
              cdr_epi_weight: 2.0
              min_weight: 1.0
              topk_weight: 0.5
              coverage_weight: 0.5
  conditioner:
    use_attention_pool: False
    FR1: True
    FR2: True
    FR3: True
    FR4: True
    FR5: True
    FR6: True
    FR7: True
    FR8: True
    CDR1: True
    CDR2: True
    CDR3: True
    CDR4: True
    CDR5: True
    CDR6: True
    Epitope: True
    NonEpitope: True
  modal_training:
    enabled: True
    noise_sampling:
      noise_mode: cdr_only
      offset: 40
      adaptive_mode: 'power'
      power: 1.4
      epitope_time_strategy: induced_fit_late
      induced_fit_max_t: 10
      induced_fit_unfreeze_t_max: 25
      region_async_training:
        enabled: true
        prob: 1.00
        region_max_lag: 8
        min_t: 1
      asyndm_residue:
        enabled: true
        region_governed: true
        controller: rule_based
        slow_region_fraction: 0.50
        slow_power: 2.0
        support_weight: 0.50
        contact_weight: 0.50
        region_max_lag: 8
        sync_warmup_ratio: 0.0
        max_drain_steps: 100
      status:
        discovery: 0.7
        rigid: 0.15
        joint: 0.15

train:
  optimizer:
    type: adam
    lr: 2.e-4
    weight_decay: 0.0
    beta1: 0.9
    beta2: 0.999
  loss_weights:
    cdr_rot: 1.0
    cdr_pos: 1.0
    cdr_seq: 1.0
    epitope_rot: 0.0
    epitope_pos: 0.0
    cdr_bone: 0.0
    cdr_omega: 0.0
    epitope_bone: 0.0
    epitope_omega: 0.0
    region_contig_logit_rank: 1.0
    region_pair_contact: 0.2
    region_pair_geometry: 0.1
    region_hgacd_contact_mass: 0.1
    region_hgacd_residue_contact: 0.05
    region_hgacd_pair_contact: 0.1
    region_hgacd_contact_consistency: 0.05
  max_iters: 50000
  val_freq: 250
  batch_size: 16
  seed: 2022
  max_grad_norm: 100.0
  weight_decay: 0.01
  scheduler:
    type: plateau
    factor: 0.8
    patience: 10
    min_lr: 5.e-6

dataset:
  train:
    type: sabdab
    summary_path: ../sabdab/260112/sabdab_summary_all.tsv
    total_data_dir: ../sabdab/260112/all_structures/chothia
    processed_dir: ./data/processed/retrain/rabd_test/multi/no_aug/bs16_paced
    data_number_scheme: chothia
    split: train
    surface_annotation_mode: auto
    reset_strc: False
    transform:
    - type: mask_multiple_cdrs
      augmentation: False
      antibody_structure_generate_mode: 'cdr_only'
    - type: merge_chains
    - type: patch_around_anchor
      antigen_patch_mode: soft_only
      epitope_definition_mode: surface_core_rim
      keep_rim_in_soft_only: true
      surface_source: precomputed
      surface_exposure_radius: 10.0
      surface_exposed_ratio: 0.5
      surface_min_count: 12
      core_seed_cutoff: 6.0
      min_core_segment_len: 3
      core_merge_gap: 1
      rim_knn: 24
      rim_max_distance: 12.0
      rim_seq_window: 2
    test_data: ./test_rabd_pdb_names.txt

  val:
    type: sabdab
    summary_path: ../sabdab/260112/sabdab_summary_all.tsv
    total_data_dir: ../sabdab/260112/all_structures/chothia
    processed_dir: ./data/processed/retrain/rabd_test/multi/no_aug/bs16_paced
    data_number_scheme: chothia
    split: val
    surface_annotation_mode: auto
    reset_strc: False
    transform:
    - type: mask_multiple_cdrs
      augmentation: False
      antibody_structure_generate_mode: 'cdr_only'
    - type: merge_chains
    - type: patch_around_anchor
      antigen_patch_mode: soft_only
      epitope_definition_mode: surface_core_rim
      keep_rim_in_soft_only: true
      surface_source: precomputed
      surface_exposure_radius: 10.0
      surface_exposed_ratio: 0.5
      surface_min_count: 12
      core_seed_cutoff: 6.0
      min_core_segment_len: 3
      core_merge_gap: 1
      rim_knn: 24
      rim_max_distance: 12.0
      rim_seq_window: 2
    test_data: ./test_rabd_pdb_names.txt
    modal_training:
      noise_sampling:
        noise_mode: cdr_only
        offset: 40
        power: 1.4
        epitope_time_strategy: induced_fit_late
        induced_fit_max_t: 10
        induced_fit_unfreeze_t_max: 25
        region_async_training:
          enabled: true
          prob: 1.00
          region_max_lag: 8
          min_t: 1
        asyndm_residue:
          enabled: true
          region_governed: true
          controller: rule_based
          slow_region_fraction: 0.50
          slow_power: 2.0
          support_weight: 0.50
          contact_weight: 0.50
          region_max_lag: 8
          sync_warmup_ratio: 0.0
          max_drain_steps: 100

            residual_scale: 0.35
            condition_distance_scale: 10.0
            condition_contact_cutoff: 8.0
            use_distance_bias: true
            contact_latent_enabled: true
            contact_supervision_enabled: true
            contact_supervision_cutoff: 8.0
            contact_feedback_scale: 0.25
          aux_losses:
            enabled: true
            contig_logit_rank:
              enabled: true
              margin_logit: 0.1
              start_step: 250
              t_cdr_max: 40
            pair_contact:
              enabled: true
              start_step: 100
              cutoff: 8.0
              cdr_epi_weight: 2.0
            pair_geometry:
              enabled: true
              start_step: 100
              contact_cutoff: 8.0
              distance_clip: 20.0
              topk: 8
              cdr_epi_weight: 2.0
              min_weight: 1.0
              topk_weight: 0.5
              coverage_weight: 0.5
  conditioner:
    use_attention_pool: false
    FR1: true
    FR2: true
    FR3: true
    FR4: true
    FR5: true
    FR6: true
    FR7: true
    FR8: true
    CDR1: true
    CDR2: true
    CDR3: true
    CDR4: true
    CDR5: true
    CDR6: true
    Epitope: true
    NonEpitope: true
  modal_training:
    enabled: true
    noise_sampling:
      noise_mode: cdr_only
      offset: 40
      adaptive_mode: power
      power: 1.4
      epitope_time_strategy: induced_fit_late
      induced_fit_max_t: 10
      induced_fit_unfreeze_t_max: 25
      region_async_training:
        enabled: true
        prob: 1.0
        region_max_lag: 8
        min_t: 1
      asyndm_residue:
        enabled: true
        region_governed: true
        controller: graph_dynamic_schedule_async
        slow_region_fraction: 0.5
        slow_power: 2.0
        support_weight: 0.5
        contact_weight: 0.45
        region_max_lag: 8
        sync_warmup_ratio: 0.0
        max_drain_steps: 100
        dynamic_schedule_priority_mode: function_first
        dynamic_schedule_strength: 0.75
        dynamic_schedule_min_gamma: 0.35
        dynamic_schedule_max_gamma: 2.25
        dynamic_schedule_final_sync_clock: 8
        bio_prior_weight: 0.35
        anchor_weight: 0.2
        entropy_weight: 0.0
      status:
        discovery: 0.7
        rigid: 0.15
        joint: 0.15
